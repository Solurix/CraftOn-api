name: preview-cleanup

# Tear down a PR's API preview: delete the standalone `crafton-api-dev-pr<N>`
# service and drop its isolated database. Runs on PR close; also exposes
# workflow_dispatch so the owner can reclaim a leaked preview by number (the
# GitHub bot may lack actions:write to self-trigger, so this is run from the
# Actions tab when needed).

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose preview should be torn down
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: crafton-dev-500709
      REGION: asia-northeast1
      BASE_SERVICE: crafton-api-dev
      WIF_PROVIDER: projects/784671749504/locations/global/workloadIdentityPools/github-actions/providers/github
      DEPLOYER_SA: crafton-deployer@crafton-dev-500709.iam.gserviceaccount.com
      SQL_INSTANCE: crafton-dev
      PR: ${{ github.event.inputs.pr_number || github.event.number }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Delete the whole standalone preview service (revisions and all). Unlike the
      # old tagged-revision approach there's no "can't delete the latest revision"
      # caveat and nothing to un-tag — the service is self-contained. Best-effort so
      # a re-run on an already-clean PR still succeeds.
      - name: Delete preview service
        run: |
          gcloud run services delete "${BASE_SERVICE}-pr${PR}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet \
            || echo "service ${BASE_SERVICE}-pr${PR} already gone"

      - name: Drop per-PR database
        run: |
          gcloud sql databases delete "crafton_pr${PR}" \
            --instance="$SQL_INSTANCE" --project "$PROJECT_ID" --quiet \
            || echo "database crafton_pr${PR} already gone"
