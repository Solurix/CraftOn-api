name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:

# Cancel superseded runs on the same ref (a new push / merge-queue update wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests use the fake auth verifier — no GCP credentials required.
  CRAFTON_AUTH_MODE: fake
  CRAFTON_ENV: ci
  CRAFTON_DATABASE_URL: postgresql+psycopg://crafton:crafton@localhost:5432/crafton

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crafton
          POSTGRES_PASSWORD: crafton
          POSTGRES_DB: crafton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crafton -d crafton"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv and install dependencies
        run: |
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      - name: i18n ja/en parity check
        run: python -m app.core.i18n --check

      # Migration hygiene: a single linear head. Two heads mean a branch that must
      # be rebased/merged before it can deploy (previews and prod both migrate at
      # container boot, so an ambiguous head would fail there).
      - name: Exactly one migration head
        run: test "$(alembic heads 2>/dev/null | grep -c '(head)')" -eq 1

      - name: Migrations apply (upgrade head)
        run: alembic upgrade head

      - name: Migrations reverse (downgrade base)
        run: alembic downgrade base

      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing

  # ── Continuous deployment ───────────────────────────────────────────────────
  # On push to main (after CI passes): build + push the image and roll the Cloud
  # Run service. The container entrypoint runs `alembic upgrade head` before
  # uvicorn, and Cloud Run only shifts traffic once the new revision is healthy —
  # so this migrates first and keeps the old revision serving if a migration fails.
  # Auth is via Workload Identity Federation (no stored keys). Terraform apply stays manual.
  deploy:
    needs: lint-type-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: crafton-dev-500709
      REGION: asia-northeast1
      SERVICE: crafton-api-dev
      IMAGE: asia-northeast1-docker.pkg.dev/crafton-dev-500709/crafton/api
      WIF_PROVIDER: projects/784671749504/locations/global/workloadIdentityPools/github-actions/providers/github
      DEPLOYER_SA: crafton-deployer@crafton-dev-500709.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          docker build --platform=linux/amd64 --provenance=false \
            -t "$IMAGE:dev" -t "$IMAGE:${GITHUB_SHA}" .
          docker push "$IMAGE:dev"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Deploy to Cloud Run (migrates at startup, then serves)
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:dev"
