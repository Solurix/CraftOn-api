name: preview-deploy

# Per-PR preview environment for the API.
#
# Each PR gets a fully isolated, STANDALONE Cloud Run service `crafton-api-dev-pr<N>`
# (NOT a tagged revision of the shared crafton-api-dev) plus its own `crafton_pr<N>`
# database on the shared `crafton-dev` Cloud SQL instance. The preview migrates at
# boot against that DB and is smoke-tested in isolation.
#
# WHY A SEPARATE SERVICE (not `--no-traffic --tag`): a tagged revision does NOT
# sandbox configuration. `gcloud run deploy <shared-service> --update-env-vars …`
# mutates the SHARED service's base template, so CRAFTON_DB_NAME=crafton_pr<N> (and
# the preview-pr label) leaked onto crafton-api-dev; the next normal revision
# inherited it and, once crafton_pr<N> was dropped on PR close, the live service
# could no longer boot (`FATAL: database "crafton_pr<N>" does not exist`). A
# dedicated per-PR service has its own template, so previews can never touch the
# live service. See crafton-infra docs/12.
#
# Trust model: pull_request_target runs this workflow (and its credentialed steps)
# from `main`, so a PR can't rewrite them; CODEOWNERS gates the workflow + Dockerfile.
# The PR's code is checked out only as build input and executes inside `docker build`
# and at preview runtime (as the thin crafton-api-dev runtime SA). Fork PRs are
# skipped — they can't mint a WIF token.
#
# NOTE: because this runs from `main`, changes to the pipeline only take effect
# after they're merged; the PR that introduces them can't validate itself.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-api-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # Same-repo, non-draft PRs only (forks can't authenticate to GCP).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: crafton-dev-500709
      REGION: asia-northeast1
      # Base (live) service — described only to stay in sync with naming; previews
      # deploy to ${BASE_SERVICE}-pr<N>, a separate service, and never touch this one.
      BASE_SERVICE: crafton-api-dev
      IMAGE: asia-northeast1-docker.pkg.dev/crafton-dev-500709/crafton/api
      WIF_PROVIDER: projects/784671749504/locations/global/workloadIdentityPools/github-actions/providers/github
      DEPLOYER_SA: crafton-deployer@crafton-dev-500709.iam.gserviceaccount.com
      RUNTIME_SA: crafton-api-dev@crafton-dev-500709.iam.gserviceaccount.com
      SQL_INSTANCE: crafton-dev
      SQL_CONNECTION: crafton-dev-500709:asia-northeast1:crafton-dev
      DB_SECRET: crafton-db-url
      PR: ${{ github.event.number }}
      # PR head sha — changes on every push, so the image tag stays unique.
      # (GITHUB_SHA is the base-branch sha under pull_request_target and would collide.)
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # PR head is checked out only as build input — no PR script runs on the runner.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Compute identifiers
        run: |
          SHORT_SHA="${HEAD_SHA::7}"
          {
            echo "PREVIEW_SERVICE=${BASE_SERVICE}-pr${PR}"
            echo "DB=crafton_pr${PR}"
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "IMAGE_TAG=${IMAGE}:pr${PR}-${SHORT_SHA}"
          } >> "$GITHUB_ENV"

      # Isolated per-PR database (idempotent across synchronize pushes). Cloned from
      # template1; crafton_app is a Cloud SQL cloudsqlsuperuser member, so it can
      # create tables in the fresh DB's public schema at boot — no grant needed
      # (see docs/12-preview-environments.md).
      - name: Create per-PR database
        run: |
          gcloud sql databases create "$DB" --instance="$SQL_INSTANCE" \
            --project "$PROJECT_ID" 2>/dev/null && echo "created $DB" \
            || echo "$DB already exists — reusing"

      - name: Build & push preview image
        run: |
          docker build --platform=linux/amd64 --provenance=false \
            -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      # Deploy a DEDICATED per-PR service. Because it's standalone, the full runtime
      # config is set EXPLICITLY (there's no shared template to inherit from, and
      # crucially nothing this deploy does can leak onto the live service):
      #   * --service-account + --add-cloudsql-instances + --set-secrets → DB access
      #   * --set-env-vars → the complete preview env (CRAFTON_DB_NAME points the app
      #     at the isolated DB; STORAGE_MODE=fake so it never writes the shared bucket)
      #   * --allow-unauthenticated → the smoke test (and humans) can reach it, just
      #     like the public dev service
      # Migrations run at container boot against $DB (Dockerfile entrypoint),
      # serialized by the advisory lock in env.py.
      - name: Deploy preview service
        run: |
          gcloud run deploy "$PREVIEW_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE_TAG" \
            --labels "preview-pr=${PR}" \
            --service-account "$RUNTIME_SA" \
            --add-cloudsql-instances "$SQL_CONNECTION" \
            --set-secrets "CRAFTON_DATABASE_URL=${DB_SECRET}:latest" \
            --set-env-vars "CRAFTON_ENV=dev,CRAFTON_AUTH_MODE=fake,CRAFTON_STORAGE_MODE=fake,CRAFTON_FIREBASE_PROJECT_ID=${PROJECT_ID},CRAFTON_DB_NAME=${DB}" \
            --allow-unauthenticated \
            --quiet

      - name: Resolve preview URL
        run: |
          API_URL=$(gcloud run services describe "$PREVIEW_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          if [ -z "$API_URL" ]; then echo "could not read preview service URL"; exit 1; fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      # Liveness via /openapi.json (NOT /healthz — Google's edge returns 404 for it
      # on *.run.app). Then signup→login→/me exercises a real write+read against the
      # isolated DB, proving migrations ran. The first request cold-starts the
      # service, so allow generous time for boot + migrate.
      - name: Smoke test the preview
        run: |
          echo "Preview API: $API_URL"
          code=""
          for i in $(seq 1 48); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/openapi.json" || true)
            [ "$code" = "200" ] && { echo "live after ~$((i*5))s"; break; }
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::API never became live"; exit 1; }

          SUFFIX=$(printf '%08d' $(( (GITHUB_RUN_ID + RANDOM) % 100000000 )))
          PHONE="+8190${SUFFIX}"
          USER="smoke${GITHUB_RUN_ID}"
          PW="smoke-password-123"
          FAKE=$(printf '{"uid":"fake-%s","phone_number":"%s"}' "$PHONE" "$PHONE" \
            | base64 -w0 | tr '+/' '-_' | tr -d '=')

          echo "signup…"
          out=$(curl -s -w '\n%{http_code}' -X POST "$API_URL/api/v1/auth/session" \
            -H "Authorization: Bearer $FAKE" -H 'Content-Type: application/json' \
            -d "{\"user_type\":\"worker\",\"display_name\":\"Smoke\",\"username\":\"$USER\",\"email\":\"$USER@smoke.local\",\"password\":\"$PW\"}")
          body=$(printf '%s' "$out" | sed '$d'); scode=$(printf '%s' "$out" | tail -n1)
          echo "  -> $scode"
          case "$scode" in 200|201) ;; *) echo "$body"; exit 1;; esac

          echo "login…"
          out=$(curl -s -w '\n%{http_code}' -X POST "$API_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"identifier\":\"$USER\",\"password\":\"$PW\"}")
          body=$(printf '%s' "$out" | sed '$d'); lcode=$(printf '%s' "$out" | tail -n1)
          echo "  -> $lcode"
          [ "$lcode" = "200" ] || { echo "$body"; exit 1; }
          TOKEN=$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')

          echo "GET /me…"
          mecode=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/v1/me" \
            -H "Authorization: Bearer $TOKEN")
          echo "  -> $mecode"
          [ "$mecode" = "200" ] || { echo "::error::/me failed"; exit 1; }
          echo "SMOKE OK"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          API_URL: ${{ env.API_URL }}
          DB: ${{ env.DB }}
          PREVIEW_SERVICE: ${{ env.PREVIEW_SERVICE }}
        with:
          script: |
            const marker = '<!-- crafton-preview-api -->';
            const { API_URL, DB, PREVIEW_SERVICE } = process.env;
            const pr = context.issue.number;
            const body = [
              marker,
              '### 🔎 API preview',
              `- **URL:** ${API_URL}`,
              `- **Database:** \`${DB}\` (isolated, migrated)`,
              `- **Service:** \`${PREVIEW_SERVICE}\` — standalone, isolated from the live API`,
              '',
              'Smoke test (signup → login → `/me`) passed against the isolated DB.',
              'Torn down automatically when this PR closes.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
